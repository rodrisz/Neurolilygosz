; PlatformIO Project Configuration File
;
; Dos entornos en este proyecto (T-Watch 2020 V2):
;   - neurowatch         → src/Neurowatch/        UI completa + BT + SD + walking med
;   - watchcoherenciasz  → src/watchcoherenciasz/ BT MindWave + ESP-NOW al ESP32-WROOM
;
; Comparten board y framework; solo cambia el filtro de fuentes.

[platformio]
default_envs = neurowatch

[env]
platform   = espressif32
board      = ttgo-t-watch
framework  = arduino
build_flags = -Wno-discarded-qualifiers

; ─────────────────────────────────────────────────────────────────────────
;  Entorno 1: Neurowatch (programa principal del T-Watch)
; ─────────────────────────────────────────────────────────────────────────
[env:neurowatch]
upload_port      = COM13
build_src_filter = +<Neurowatch/>

; ─────────────────────────────────────────────────────────────────────────
;  Entorno 2: watchcoherenciasz (T-Watch como hub del sistema Mindcoherenciasz)
; ─────────────────────────────────────────────────────────────────────────
[env:watchcoherenciasz]
upload_port      = COM13
monitor_speed    = 115200
build_src_filter = +<watchcoherenciasz/>
build_flags      = -Wno-discarded-qualifiers
; Particion grande: BT Classic + WiFi/ESP-NOW + UI ocupan mucho
board_build.partitions = huge_app.csv
